<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CleanNews Vault - Lector</title>
  <link rel="stylesheet" href="reader.css">
</head>
<body>
  <!-- Reading Progress Bar -->
  <div id="reading-progress" class="reading-progress">
    <div id="reading-progress-fill" class="reading-progress-fill"></div>
  </div>

  <!-- Top Bar -->
  <header class="reader-topbar">
    <div class="topbar-inner">
      <button id="back-btn" class="btn btn-ghost btn-sm">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
        <span>Volver</span>
      </button>

      <h2 id="topbar-title" class="topbar-title"></h2>

      <div class="topbar-actions">
        <button id="favorite-btn" class="btn btn-ghost btn-sm" title="Favorito">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        </button>
        <button id="read-status-btn" class="btn btn-ghost btn-sm" title="Marcar como leído/no leído">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </button>
        <div class="collection-dropdown">
          <button id="collection-btn" class="btn btn-ghost btn-sm" title="Colecciones">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
          </button>
          <div id="collection-menu" class="collection-menu hidden">
            <div class="collection-menu-header">Añadir a colección</div>
            <div id="collection-menu-items"></div>
          </div>
        </div>
        <button id="edit-btn" class="btn btn-ghost btn-sm" title="Editar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        </button>

        <!-- Highlight Button -->
        <button id="highlight-btn" class="btn btn-ghost btn-sm" title="Modo resaltado">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg>
        </button>

        <!-- Share Button -->
        <div class="share-dropdown">
          <button id="share-btn" class="btn btn-ghost btn-sm" title="Compartir">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
          </button>
          <div id="share-menu" class="share-menu hidden">
            <button data-share="link" class="share-option">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
              Copiar enlace
            </button>
            <button data-share="content" class="share-option">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              Copiar contenido
            </button>
            <button data-share="text" class="share-option">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
              Copiar como texto
            </button>
          </div>
        </div>

        <!-- Pomodoro Button -->
        <button id="pomodoro-btn" class="btn btn-ghost btn-sm" title="Pomodoro">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"></circle><polyline points="12 9 12 13 15 13"></polyline><line x1="12" y1="1" x2="12" y2="3"></line><line x1="8" y1="1" x2="8" y2="3"></line><line x1="16" y1="1" x2="16" y2="3"></line></svg>
        </button>

        <!-- Focus Mode Button -->
        <button id="focus-btn" class="btn btn-ghost btn-sm" title="Modo concentración">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>

        <!-- Annotations Button -->
        <button id="annotations-btn" class="btn btn-ghost btn-sm" title="Anotaciones">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        </button>

        <div class="export-dropdown">
          <button id="export-btn" class="btn btn-ghost btn-sm" title="Exportar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            <span>Exportar</span>
          </button>
          <div id="export-menu" class="export-menu hidden">
            <button data-format="txt" class="export-option">Texto (.txt)</button>
            <button data-format="md" class="export-option">Markdown (.md)</button>
            <button data-format="json" class="export-option">JSON (.json)</button>
            <button data-format="pdf" class="export-option">PDF (imprimir)</button>
          </div>
        </div>
        <button id="delete-btn" class="btn btn-ghost btn-sm btn-delete" title="Eliminar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
        <div class="topbar-divider"></div>
        <div class="font-size-controls">
          <button id="font-decrease" class="btn btn-ghost btn-sm btn-xs" title="Reducir fuente">A−</button>
          <button id="font-normal" class="btn btn-ghost btn-sm btn-xs active" title="Fuente normal">A</button>
          <button id="font-increase" class="btn btn-ghost btn-sm btn-xs" title="Aumentar fuente">A+</button>
        </div>
        <button id="theme-toggle" class="btn btn-ghost btn-sm" title="Cambiar tema">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- TOC Toggle Button (floating) -->
  <button id="toc-toggle" class="btn toc-toggle-btn" title="Tabla de contenidos">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
  </button>

  <!-- TOC Sidebar -->
  <aside id="toc-sidebar" class="toc-sidebar">
    <div class="toc-sidebar-header">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
      <span>Índice</span>
    </div>
    <nav id="toc-list" class="toc-list"></nav>
  </aside>

  <!-- Highlight Toolbar (floating) -->
  <div id="highlight-toolbar" class="highlight-toolbar hidden">
    <button class="highlight-color-btn" data-color="yellow" title="Amarillo" style="background:#fef08a"></button>
    <button class="highlight-color-btn" data-color="green" title="Verde" style="background:#bbf7d0"></button>
    <button class="highlight-color-btn" data-color="red" title="Rojo" style="background:#fecaca"></button>
    <button class="highlight-color-btn" data-color="blue" title="Azul" style="background:#bfdbfe"></button>
    <div class="highlight-toolbar-divider"></div>
    <button id="highlight-note-btn" class="highlight-note-btn" title="Añadir nota">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      <span>Nota</span>
    </button>
  </div>

  <!-- Highlight Note Popup -->
  <div id="highlight-note-popup" class="highlight-note-popup hidden">
    <textarea id="highlight-note-input" class="highlight-note-input" rows="3" placeholder="Escribe tu nota..."></textarea>
    <div class="highlight-note-actions">
      <button id="highlight-note-save" class="btn btn-primary btn-sm">Guardar</button>
      <button id="highlight-note-cancel" class="btn btn-secondary btn-sm">Cancelar</button>
    </div>
  </div>

  <!-- Main Content -->
  <main id="reader-main" class="reader-main">
    <article class="reader-article">
      <!-- View Mode -->
      <div id="view-mode" class="view-mode">
        <header class="article-header">
          <!-- Featured Image -->
          <div id="featured-image-container" class="featured-image-container hidden">
            <img id="featured-image" class="featured-image" src="" alt="">
          </div>

          <h1 id="article-title" class="article-title"></h1>
          <div class="article-meta">
            <span id="article-author" class="meta-item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              <span></span>
            </span>
            <span id="article-source" class="meta-item meta-source">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
              <a id="source-link" href="#" target="_blank" rel="noopener"><span></span></a>
            </span>
            <span id="article-date" class="meta-item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
              <span></span>
            </span>
            <span id="article-stats" class="meta-item meta-stats"></span>
          </div>
          <div id="article-tags" class="article-tags"></div>
          <div id="article-collections" class="article-collections"></div>
        </header>

        <div id="article-content" class="article-content"></div>

        <!-- Notes Section -->
        <div id="article-notes-section" class="notes-section hidden">
          <h3 class="notes-title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
            Notas
          </h3>
          <div id="article-notes" class="notes-text"></div>
        </div>

        <!-- Source Link -->
        <div id="article-source-link" class="source-link-section hidden">
          <a id="source-url" href="#" target="_blank" rel="noopener" class="source-url-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
            Leer en la fuente original
          </a>
        </div>
      </div>

      <!-- Edit Mode -->
      <div id="edit-mode" class="edit-mode hidden">
        <div class="edit-group">
          <label for="edit-title">Título</label>
          <input type="text" id="edit-title" class="edit-input">
        </div>
        <div class="edit-group">
          <label for="edit-tags">Etiquetas (separadas por comas)</label>
          <input type="text" id="edit-tags" class="edit-input" placeholder="tecnología, ciencia, opinión...">
        </div>
        <div class="edit-group">
          <label for="edit-collection">Colección</label>
          <select id="edit-collection" class="edit-select">
            <option value="">Sin colección</option>
          </select>
        </div>
        <div class="edit-group">
          <label for="edit-notes">Notas</label>
          <textarea id="edit-notes" class="edit-textarea" rows="4" placeholder="Añade tus notas aquí..."></textarea>
        </div>
        <div class="edit-group">
          <label for="edit-content">Contenido (texto plano)</label>
          <textarea id="edit-content" class="edit-textarea" rows="16"></textarea>
        </div>
        <div class="edit-actions">
          <button id="save-edit" class="btn btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
            Guardar Cambios
          </button>
          <button id="cancel-edit" class="btn btn-secondary">Cancelar</button>
        </div>
      </div>
    </article>
  </main>

  <!-- Annotations Panel (slide-in from right) -->
  <div id="annotations-panel" class="annotations-panel">
    <div class="annotations-panel-header">
      <h3 class="annotations-panel-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        Anotaciones
      </h3>
      <button id="annotations-close" class="btn btn-ghost btn-sm btn-xs" title="Cerrar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div id="annotations-list" class="annotations-list">
      <div class="annotations-empty">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--text-muted)"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        <p>No hay anotaciones aún</p>
        <p class="annotations-empty-hint">Selecciona texto y resáltalo para crear anotaciones</p>
      </div>
    </div>
  </div>

  <!-- Pomodoro Widget (overlay) -->
  <div id="pomodoro-widget" class="pomodoro-widget hidden">
    <div class="pomodoro-widget-inner">
      <div class="pomodoro-mode-indicator">
        <span id="pomodoro-mode-label" class="pomodoro-mode-label">Trabajo</span>
        <span id="pomodoro-completed" class="pomodoro-completed hidden">0</span>
      </div>
      <div id="pomodoro-timer" class="pomodoro-timer">25:00</div>
      <div class="pomodoro-controls">
        <button id="pomodoro-play" class="btn btn-primary btn-sm" title="Iniciar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </button>
        <button id="pomodoro-reset" class="btn btn-ghost btn-sm" title="Reiniciar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
        </button>
        <button id="pomodoro-close" class="btn btn-ghost btn-sm" title="Cerrar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Delete Modal -->
  <div id="delete-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <h3>¿Eliminar artículo?</h3>
      <p>Esta acción no se puede deshacer. El artículo será eliminado permanentemente.</p>
      <div class="modal-actions">
        <button id="confirm-delete" class="btn btn-danger">Eliminar</button>
        <button id="cancel-delete" class="btn btn-secondary">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
    <span id="toast-message"></span>
  </div>

  <script src="../utils/db.js"></script>
  <script src="../utils/url.js"></script>
  <script src="../utils/search.js"></script>
  <script src="../utils/auto-tagger.js"></script>
  <script src="../utils/storage.js"></script>
  <script src="../utils/export.js"></script>
  <script src="../utils/highlights.js"></script>
  <script src="../utils/pomodoro.js"></script>
  <script src="reader.js"></script>
</body>
</html>
